name: codspeed

# Runs tests/test_benchmarks.py under CodSpeed's CPU simulation, which reports each
# benchmark's change on a pull request against the base branch.

on:
  push:
    branches: [main]
  # Required for the performance report on a pull request.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Lets CodSpeed backtest earlier commits for initial data.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # See python.yml.
  UV_MALWARE_CHECK: "1"
  UV_PREVIEW_FEATURES: malware-check

jobs:
  benchmarks:
    name: benchmarks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # OpenID Connect authentication with CodSpeed, instead of a stored token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          save-cache: ${{ github.event_name != 'pull_request' }}
          version: "0.13.5"

      # The interpreter is the one .python-version names.
      - run: uv sync --locked

      - uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          mode: simulation
          run: uv run pytest tests/test_benchmarks.py --codspeed
