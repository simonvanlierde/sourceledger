name: fair

# fair-software.eu: howfairis scores the public repository on five recommendations (repository,
# license, registry, citation, checklist) and the job summary lists which checks pass. A new
# repo misses the registry and checklist checks until you list it in a registry and earn the
# OpenSSF Best Practices badge, so the job fails only below the floor in FAIR_MIN. It runs
# weekly, not on every pull request.
on:
  schedule:
    - cron: "17 6 * * 3" # Wednesdays, 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  howfairis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Filled dots required out of five. A new repo has three: raise this as you earn the rest.
      # At five, add the README badge whose snippet howfairis prints in the job summary.
      FAIR_MIN: 3
      # Without a token howfairis shares the runner IP's 60 requests an hour, and a refused
      # request scores its check as missing without an error. The job's token raises the limit.
      APIKEY_GITHUB: x-access-token:${{ github.token }}
    steps:
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      # howfairis exits 1 below five checks, so the score is read from its output.
      - run: |-
          uvx --from git+https://github.com/fair-software/howfairis@0.15.0 howfairis https://github.com/simonvanlierde/sourceledger | tee out.txt || true
          cat out.txt >> "$GITHUB_STEP_SUMMARY"
          score=$(grep '^Calculated compliance' out.txt | grep -o '●' | wc -l)
          echo "fair-software.eu score: $score of 5 (floor $FAIR_MIN)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$score" -ge "$FAIR_MIN" ]
