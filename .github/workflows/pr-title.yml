name: pr title

# A squash merge makes the pull request title the commit subject on main, so the title
# follows committed.toml, as each commit does through the commit-msg hook. Runs again
# when the title is edited.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: pull request title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # As in python.yml: uv checks every package against OSV's malware advisories before
      # its code runs. The preview flag only silences the "experimental" warning.
      UV_MALWARE_CHECK: "1"
      UV_PREVIEW_FEATURES: malware-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: committed.toml
          sparse-checkout-cone-mode: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # This workflow runs on pull requests only, and a cache a pull request saves is
          # readable by that pull request alone. committed is one small wheel.
          enable-cache: false
          version: "0.13.6"

      - name: check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | uvx --exclude-newer "1 week" committed@1.1.11 --config committed.toml --commit-file -
