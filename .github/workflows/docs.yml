name: docs

# The documentation site that `just docs` builds from docs/ into _docs/. Every pull request
# and push builds it with --strict, so a broken link or a warning fails the check. A push to
# main deploys that build to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pull requests only: a newer push to main must not cancel a deploy in flight.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: "docs: build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # As in python.yml: uv checks every package against OSV's malware advisories before
      # its code runs. The preview flag only silences the "experimental" warning.
      UV_MALWARE_CHECK: "1"
      UV_PREVIEW_FEATURES: malware-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: just@1.59.0
          fallback: none

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          save-cache: ${{ github.event_name != 'pull_request' }}
          version: "0.13.6"

      - run: just docs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _docs

  deploy:
    name: "docs: deploy"
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    # Never cancelled halfway, so a deploy in flight finishes before the next starts.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # to deploy to GitHub Pages
      id-token: write # to prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The first push to main can come before `just repo-settings` turns Pages on.
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if build=$(gh api "repos/$REPO/pages" --jq .build_type 2>gh.err); then
            if [ "$build" = workflow ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif ! grep -q 'HTTP 404' gh.err; then
            cat gh.err >&2
            exit 1
          fi
          echo "::notice::GitHub Pages is off or does not deploy from Actions: run just repo-settings."
          echo "run=false" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.run == 'true'
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
