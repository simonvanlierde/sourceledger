name: python release

# Trusted publishing: no API token. Configure the publisher once at
# https://pypi.org/manage/account/publishing/ for repo simonvanlierde/sourceledger,
# workflow `python-release.yml`, environment `pypi`.
#
# In the repo's Settings > Environments, limit `pypi` to tags matching `v*` and add
# yourself as a required reviewer. Otherwise anyone who can push a branch can
# dispatch an edited copy of this workflow and publish from it.
#
# The build job builds the distributions and installs nothing but uv, so no test
# dependency runs where dist/ is made. The test job re-runs the full suite, since a
# release tag can point at a commit that never went green, then runs it against the
# built wheel, the only place packaging faults such as a wrong module name show up.
#
# `id-token: write` exposes an OpenID Connect (OIDC) request token to every step
# in its job, so publish is a separate job that runs no project code.
#
# After PyPI, the release job attaches distributions, a CycloneDX SBOM and their
# provenance to a draft, checks every attestation, then publishes the draft. Immutable
# releases accept no assets after publication. Each asset carries its bundle as
# `<asset>.intoto.jsonl`, the name Scorecard's Signed-Releases check scores highest.

# No workflow_dispatch: a manual run can target any branch, and neither trusted
# publishing nor the environment checks which ref it publishes.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# One group per release tag: a second run for the same tag waits, and no release
# cancels or replaces another.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # As in python.yml: uv checks every package against OSV's malware advisories before
  # its code runs. The preview flag only silences the "experimental" warning.
  UV_MALWARE_CHECK: "1"
  UV_PREVIEW_FEATURES: malware-check,sbom-export

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Publish only a tag signed with a key in .github/allowed_signers, read from the
      # default branch: the tagged commit's own copy is whatever the tag's pusher wrote.
      # GitHub's "verified" flag would accept a key registered to any account. The workflow
      # also comes from the tagged commit, so the pypi environment's reviewer stays the gate.
      - name: refuse a tag not signed by an allowed key
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # checkout fetches the tagged commit, not the annotated tag object that holds the signature.
          git fetch --no-tags --depth=1 --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git fetch --no-tags --depth=1 origin "refs/heads/$DEFAULT_BRANCH"
          git show FETCH_HEAD:.github/allowed_signers >"$RUNNER_TEMP/allowed_signers"
          if ! git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" tag -v "$TAG"; then
            echo "$TAG is not an annotated tag signed with a key in .github/allowed_signers on $DEFAULT_BRANCH; make it with .github/scripts/tag-release.sh" >&2
            exit 1
          fi

      # No cache: an entry written from any branch is restorable here, which
      # would put attacker-controlled bytes into the wheel this workflow signs.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.13.6"

      # The wheel takes its version from pyproject.toml, not the tag: refuse a mismatch.
      - run: test "$(uv version --short)" = "${GITHUB_REF_NAME#v}"

      # Validate and save the notes before PyPI publishes anything.
      - run: '"$GITHUB_WORKSPACE/.github/scripts/release-notes.sh" "$GITHUB_REF_NAME" "$GITHUB_WORKSPACE/CHANGELOG.md" >"$RUNNER_TEMP/notes.md"'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md

      - run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ./dist/

      # The SBOM lists the locked runtime dependencies, so the versions we tested with,
      # not what a user will resolve. The wheel is pure Python and carries none of its own.
      - run: |
          mkdir sbom
          uv export --locked --no-dev --format cyclonedx1.5 -o "sbom/$(basename dist/*.tar.gz).cdx.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ./sbom/

  # Publish only what passes, on the exact commit being released. The dev group runs
  # here, after dist/ is uploaded, so a test dependency cannot change what is signed.
  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.13.6"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run pytest

      # The suite again, against the wheel instead of src/. --no-project stops uv
      # resolving the local tree, so the import can only come from dist/. The test
      # tools come from uv.lock, with their hashes, not from whatever PyPI serves now.
      - run: |
          uv export --locked --only-group dev --no-emit-project >"$RUNNER_TEMP/dev.txt"
          uv run --isolated --no-project --with dist/*.whl --with-requirements "$RUNNER_TEMP/dev.txt" pytest tests

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    # Job-level permissions replace the workflow-level grant, so restate contents.
    permissions:
      contents: read
      id-token: write # required for trusted publishing, and to sign the attestation
      attestations: write
      artifact-metadata: write # the attestation's storage record
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          # No checkout here: dist/ at the root, where the publish action looks.
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom/
      # A signed build-provenance attestation per file, so anyone can check where a wheel
      # was built: `gh attestation verify <file> --repo <owner>/<repo>`. This job runs no
      # project code, so the token that signs it never reaches the test suite.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: |
            dist/*
            sbom/*
      # The SBOM, attested against the sdist it was exported alongside.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest-sbom
        with:
          subject-path: dist/*.tar.gz
          sbom-path: sbom/*.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance
          path: ${{ steps.attest.outputs.bundle-path }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-attestation
          path: ${{ steps.attest-sbom.outputs.bundle-path }}
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # PyPI already has this version if this job fails: re-run only this job.
  # Delete a leftover draft first; a published immutable release needs a new version.
  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: assets/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: assets/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provenance
          path: provenance/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-attestation
          path: sbom-attestation/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes/
      # No checkout or project code runs with the write token.
      - name: publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |-
          set -euo pipefail
          cd assets
          # One provenance bundle covers every asset; each gets a copy under its own name.
          # The glob also checks that each attest step produced exactly one bundle.
          for f in *; do cp ../provenance/*.json "$f.intoto.jsonl"; done
          sdist=$(echo *.tar.gz)
          cp ../sbom-attestation/*.json "$sdist.sbom.intoto.jsonl"
          printf '\nThe SBOM lists the dependency versions this release was tested with, not what an install will resolve.\n' >>../notes/notes.md
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file ../notes/notes.md ./*
          # Immutable once published: check every attestation against the repo first.
          for f in *; do
            case $f in *.intoto.jsonl) continue ;; esac
            gh attestation verify "$f" --repo "$GH_REPO" --bundle "$f.intoto.jsonl"
          done
          gh attestation verify "$sdist" --repo "$GH_REPO" --bundle "$sdist.sbom.intoto.jsonl" \
            --predicate-type https://cyclonedx.org/bom
          gh release edit "$TAG" --draft=false
