name: property

# The property tests at length once a week, with the same `just <stack>-property`
# recipes you run by hand. The test job runs them briefly on every change; this run
# tries far more inputs. A failing input fails the job. Run it from the
# Actions tab with "Run workflow" after you change the tests.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    name: "property: python"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.13.6"

      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: just@1.59.0

      - run: uv sync --locked
      - run: just py-property
