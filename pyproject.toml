[project]
name = "sourceledger"
version = "0.5.1"
description = "Fetch or record a dataset's public files with provenance, and release it without files whose terms forbid it"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Simon van Lierde", email = "code@duinlab.nl" }]
license = "MIT"
license-files = ["LICENSE"]
# citesync compares keywords with CITATION.cff.
keywords = ["provenance", "data pipeline", "reproducibility", "open data", "research software", "FAIR"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = []

# The `sourceledger` command, reading each source by its format. A project
# with its own readers calls `sourceledger.entry` from its own entry point instead.
[project.scripts]
sourceledger = "sourceledger.cli:entry"

[project.urls]
Homepage = "https://github.com/simonvanlierde/sourceledger"
Issues = "https://github.com/simonvanlierde/sourceledger/issues"
Changelog = "https://github.com/simonvanlierde/sourceledger/blob/main/CHANGELOG.md"

[project.optional-dependencies]
xlsx = [
    "openpyxl>=3.1",
]
parquet = [
    "pyarrow>=23",
]
release = [
    "mlcroissant>=1.1.1",
    "roc-validator>=0.13.1",
]

[dependency-groups]
dev = [
  "frictionless>=5.20",
  "hypothesis>=6.170.13",
  "jsonschema>=4.26",
  "mlcroissant>=1.1.1",
  "mutmut>=3.8.1",
  "openpyxl>=3.1",
  "polars>=1.35",
  "pyarrow>=23",
  "pytest>=9.2.0",
  "pytest-codspeed>=5.0.3",
  "pytest-cov>=7.1.0",
  "roc-validator>=0.13.1",
  "ruff>=0.17.3",
  "ty>=0.0.93",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"

# Resolve only releases at least a week old: a compromised release is usually
# caught and yanked within that window. Renovate's minimumReleaseAge waits the same.
# Set here, not user-wide, so every machine writes the same uv.lock.
[tool.uv]
exclude-newer = "1 week"

# uv_build derives the package dir from the normalized project.name, so pin it
# for a module_name that differs.
[tool.uv.build-backend]
module-name = "sourceledger"

# NOTE: self-contained ruff config, deliberately not extended from any shared base.
# No target-version: ruff derives it from requires-python above.
[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["ALL", "PLW1514"]  # unspecified-encoding is preview-only, so ALL skips it
ignore = [
  "ANN204", # missing-return-type-special-method
  "COM812", # trailing-comma-missing: conflicts with the formatter
  "CPY001", # missing copyright notice
  "D105",   # undocumented-magic-method
  "D107",   # undocumented-public-init
  "TD002",  # missing-todo-author: a plain `# TODO:` is enough
  "TD003",  # missing-todo-link
]

# Tests assert, use literal expectations, and need no docstrings, return
# annotations, or package __init__.py.
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "D1", "INP001", "PLR2004", "ANN201"]
# A documentation script: it prints, is not a package, and carries no annotations.
"docs/examples/**" = ["T201", "INP001", "D1", "ANN", "E501", "FBT003", "B905"]
# The command line reports to the terminal.
"src/sourceledger/cli.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int"]
max-args = 10

# The example script imports pyarrow, which the project environment need not hold.
[tool.ty.src]
exclude = ["docs/examples"]

# A rule set to "warn" reports without failing: ty otherwise exits 1 on warnings too.
[tool.ty.terminal]
error-on-warning = false

# pytest 9's native table. strict turns unknown config keys, unknown markers and
# an xfail test that passes into errors, and filterwarnings turns warnings into
# failures, so a deprecation shows up in CI, not after the upgrade that removes it.
[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--import-mode=importlib", "-m", "not live"]
markers = ["live: calls a real external service; deselected unless run with -m live"]
# The test modules import their shared helpers from tests/support.py.
pythonpath = ["tests"]
testpaths = ["tests"]
strict = true
filterwarnings = [
  "error",
  # frictionless and its validators still call the deprecated helper on Python 3.15.
  "ignore:os.path.commonprefix\\(\\) is deprecated:DeprecationWarning",
  # rdflib's JSON-LD parser constructs its own deprecated graph class.
  "ignore:ConjunctiveGraph is deprecated:DeprecationWarning:rdflib.plugins.parsers.jsonld",
]
log_level = "INFO"

# Coverage is opt-in via `pytest --cov` (`just py-cov`), not addopts, because it
# slows every plain test run. CI's run fails under the fail_under below.
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
# CI runs the suite with --cov and fails below this. Not in addopts: the release
# workflow tests the installed wheel, where src/ is not what runs.
fail_under = 95
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# `just py-mutation` runs it. The docs tests read the README and docs/ from the copy.
[tool.mutmut]
# Polars starts worker threads; forking after tests used them can deadlock a mutant.
process_isolation = "forkserver"
source_paths = ["src"]
also_copy = ["README.md", "docs", ".github/scripts", "src/sourceledger/sources.schema.json"]
# Log calls only change diagnostics; their mutants would all survive.
do_not_mutate_patterns = ['^\s*_logger\.\w+\(']

# Checks from Scientific Python's repo-review (the sp-repo-review git hook) that this
# project skips on purpose. `prek run sp-repo-review --all-files` runs the rest.
[tool.repo-review.ignore]
PY007 = "just is the task runner: `just check` runs what CI runs"
PC110 = "ruff format runs as a local hook from the venv, the same ruff CI runs"
PC140 = "ty runs as a local hook from the venv"
PC170 = "no reStructuredText: rumdl checks the Markdown docs"
PC190 = "ruff check runs as a local hook from the venv"
PC901 = "the hooks run in CI's checks workflow, not on pre-commit.ci"
PC902 = "the hooks run in CI's checks workflow, not on pre-commit.ci"
PC903 = "the hooks run in CI's checks workflow, not on pre-commit.ci"
GH200 = "Renovate updates the actions and hook revs (renovate.json5)"
